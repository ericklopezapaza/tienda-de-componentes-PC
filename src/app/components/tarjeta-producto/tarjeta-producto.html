
<article class="card producto-card h-100 shadow-sm">

  <!-- Imagen del producto -->
  <div class="producto-imagen-container">

    <img
      [src]="producto().imagen"
      [alt]="producto().nombre"
      class="card-img-top producto-imagen"
    >

    @if (producto().stock > 0) {

      <span class="badge bg-success estado-producto">
        Disponible
      </span>

    } @else {

      <span class="badge bg-danger estado-producto">
        Agotado
      </span>

    }

  </div>


  <!-- Información del producto -->
  <div class="card-body d-flex flex-column">

    <!-- Categoría -->
    <span class="badge bg-primary-subtle text-primary categoria-producto">

      {{ producto().categoria | uppercase }}

    </span>


    <!-- Nombre -->
    <h5 class="card-title fw-bold mt-3">

      {{ producto().nombre }}

    </h5>


    <!-- Descripción -->
    <p class="card-text text-secondary descripcion-producto">

      {{ producto().descripcion }}

    </p>


    <!-- Precio -->
    <h4 class="precio-producto fw-bold mt-auto">

      {{ producto().precio | currency:'BOB':'symbol':'1.2-2' }}

    </h4>


    <!-- Stock -->
    <p class="small text-secondary mb-3">

      Existencias: {{ producto().stock }}

    </p>


    <!-- Botón de compra -->
    <button
      type="button"
      class="btn btn-primary w-100"
      [disabled]="producto().stock <= 0"
      (click)="agregarProducto()">

      @if (producto().stock > 0) {

        <i class="bi bi-cart-plus me-2"></i>
        Agregar a la compra

      } @else {

        Producto agotado

      }

    </button>

  </div>

</article>
